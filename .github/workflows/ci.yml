name: Autoloop checks
on:
  push:
    branches: ['ci/included/**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-regression:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      GOAL_CHECKS_REAL_SEATBELT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: /usr/bin/python3 -B scripts/check.py
