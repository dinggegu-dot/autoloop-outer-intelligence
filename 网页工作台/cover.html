<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102f4d"><title>目标漫游局 · 王国旅行地图</title><link rel="stylesheet" href="/cover.css"><link rel="stylesheet" href="/world.css"><link rel="stylesheet" href="/odyssey.css"><script type="module" src="/cover.js"></script></head>
<body class="game-view">
  <section id="kingdom-screen" aria-label="王国选择工作台">
    <div id="globe-canvas" tabindex="0" role="region" aria-label="立体旅行星球，拖动旋转，滚轮缩放"></div>
    <div class="space-grain" aria-hidden="true"></div>
    <header class="game-topbar"><a class="game-brand" href="/workbench"><img data-art="red-cappy.png" alt="凯皮"><span>目标漫游局<small>THE NEXT GREAT ADVENTURE</small></span></a><nav aria-label="旅行菜单"><button class="launch-task" data-create-task>＋ 创建任务</button><button data-view="tasks">任务工作台</button><button data-view="agents">Agent 小队</button><button data-view="approvals">待处理 <span id="game-open">—</span></button></nav><div class="moon-counter"><img data-art="power-moon.png" alt="力量之月"><strong id="game-moons">—</strong><span><span id="game-moon-caption">已验证阶段</span><small id="game-total">/ 10</small></span></div></header>
    <div class="kingdom-intro"><div class="travel-eyebrow"><span>WORLD 01</span> 王国旅行地图</div><h1>选择你的<br>下一站<span>。</span></h1><p>让每一个目标，都有一段看得见的旅程。</p><label class="map-mode-label">地图内容 <select id="journey-mode"><option value="">王国图鉴</option></select></label></div>
    <aside class="destination-passport"><div class="postcard"><img id="kingdom-scene" data-art="cap-scene.jpg" alt="帽子国旅行明信片"><img id="kingdom-character" class="postcard-character" data-art="cap-person.png" alt="凯皮"><span class="postcard-label">RESEARCH KINGDOM</span><span class="postcard-stamp">旅程<br>01</span></div><div class="destination-copy"><p id="kingdom-lore"></p><span class="destination-kicker" id="game-stage-id">当前目的地</span><h2 id="game-stage-title">海之国</h2><p id="game-stage-description">碳酸海洋与玻璃宫殿</p><div class="game-state-line"><span id="game-stage-state">读取记录…</span><span id="game-project-state">尚未连接</span></div><button class="game-primary" id="game-enter"><span class="keycap">A</span> 查看这一站 <span>→</span></button></div></aside>
    <section id="journey-live" class="journey-live" aria-label="当前真实任务"></section>
    <img class="mario-guide" data-art="mario.png" alt="马里奥" aria-hidden="true">
    <div class="globe-caption"><span id="globe-status" role="status">正在展开旅行星球…</span><button id="globe-zoom" aria-pressed="false">⌕ 近看王国</button><button id="globe-reset">⌖ 回到当前步骤</button><button id="globe-motion" aria-pressed="false">Ⅱ 暂停飞行动效</button></div>
    <div class="journey-bar"><div class="journey-heading"><span>王国航线</span><small>选择王国，再查看对应步骤</small><span id="game-connection">本机只读记录</span></div><div id="kingdom-route" role="group" aria-label="选择任务阶段"></div></div>
    <footer class="game-footer"><div><button id="game-prev"><span class="keycap">←</span></button><button id="game-next"><span class="keycap">→</span></button><span>切换目的地</span><button data-view="tasks"><span class="keycap">B</span> 任务列表</button><button data-view="activity"><span class="keycap">Y</span> 旅行日志</button><button class="mobile-launch" data-create-task>＋ 创建任务</button><button id="game-mobile">飞书接续 ↗</button></div><p>目标漫游局 · 本机工作台</p></footer>
  </section>
<dialog id="travel-dialog"><form method="dialog"><button autofocus aria-label="关闭">×</button></form><h2></h2><p></p><a href="/workbench">进入任务工作台 →</a></dialog></body></html>
