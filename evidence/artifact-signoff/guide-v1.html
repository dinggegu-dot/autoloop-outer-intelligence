<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参观须知</title>
  <style>
    body {
      margin: 0;
      padding: clamp(1rem, 6vw, 5rem) 1rem;
      background: #f4f2ea;
      color: #20322d;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      box-sizing: border-box;
      max-width: 44rem;
      margin: 0 auto;
      padding: clamp(1.5rem, 6vw, 4rem);
      border: 1px solid #d8ddd4;
      border-top: 0.5rem solid #28604f;
      border-radius: 0.75rem;
      background: #fffef9;
    }

    h1 {
      margin: 0 0 clamp(1.5rem, 5vw, 3rem);
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.15;
    }

    ul {
      margin: 0;
      padding-inline-start: 1.4em;
      font-size: clamp(1.25rem, 3.2vw, 1.75rem);
      line-height: 1.65;
    }

    li + li {
      margin-top: 0.75em;
    }

    li::marker {
      color: #28604f;
    }
  </style>
</head>
<body>
  <main>
    <h1>参观须知</h1>
    <ul>
      <li>交谈时请放轻声音。</li>
      <li>停留时请给他人留出通道。</li>
    </ul>
  </main>
</body>
</html>
