<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1700" viewBox="0 0 1280 1700" role="img" aria-labelledby="figtitle desc" xml:lang="zh-CN"><title id="figtitle">Autoloop 两层结构确认稿</title><desc id="desc">外层只有 Router 调度。新任务按名额分派，各自绑定内层团队。订阅自动将后续消息送回相应工单。简单任务直接实施与验收。下方展开复杂工单的双方案、实物审稿、本人选择、执行、复验与返修、独立验收和结果回传。开发工单仅按既有授权合并发布。</desc><defs><marker id="arr-edge" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4d6775"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#116a58"/></marker><marker id="arr-rust" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#a44b32"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#285c9b"/></marker></defs><g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
