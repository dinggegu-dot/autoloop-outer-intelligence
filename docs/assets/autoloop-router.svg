<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 583" width="1280" height="583" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Router 层怎么安排工单</title>
<desc id="desc">Router 将工单 A 和 B 分给各自小队。B 的后续消息沿订阅送回 B。批准本轮范围后开始制作，等待期间的名额可供其他已批准工单使用。</desc>
<defs>
<marker id="slate" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#4a6573"/></marker>
<marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#275b96"/></marker>
<marker id="green" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#0f6a58"/></marker>
<marker id="repair" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#a44930"/></marker>
</defs>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1280" height="583" rx="0" fill="#f5f7f8" stroke="none" stroke-width="1.5"/>
<text x="43" y="77" font-size="51" font-weight="700" fill="#17323f" text-anchor="start">Router 层怎么安排工单</text>
<text x="45" y="116" font-size="23" font-weight="400" fill="#3f5b69" text-anchor="start">每张工单交给自己的小队，补充和决定也回到自己的工单。</text>
<rect x="36" y="149" width="1208" height="401" rx="18" fill="#fdfefe" stroke="#cfdee2" stroke-width="1.5"/>
<rect x="37" y="150" width="1206" height="59" rx="17" fill="#e7eff4" stroke="none" stroke-width="1.5"/>
<rect x="37" y="181" width="1206" height="28" rx="0" fill="#e7eff4" stroke="none" stroke-width="1.5"/>
<text x="61" y="188" font-size="28" font-weight="700" fill="#244b60" text-anchor="start">外层 · Router 接单与派工</text>
<text x="1217" y="187" font-size="19" font-weight="400" fill="#3f5b69" text-anchor="end">本次允许发送的文字才交给 Codex</text>
<path d="M316 314H386" fill="none" stroke="#4a6573" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#slate)"/>
<path d="M711 314H823" fill="none" stroke="#4a6573" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M823 314V260H925" fill="none" stroke="#4a6573" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#slate)"/>
<path d="M823 314V356H925" fill="none" stroke="#4a6573" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#slate)"/>
<circle cx="823" cy="314" r="3.6" fill="#4a6573"/>
<path d="M316 427H386" fill="none" stroke="#0f6a58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#green)"/>
<path d="M711 427H1069V394" fill="none" stroke="#0f6a58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#green)"/>
<g class="node" data-box="62 276 254 76">
<rect x="62" y="276" width="254" height="76" rx="12" fill="#f2f6f8" stroke="#abc0cd" stroke-width="1.5"/>
<text x="77" y="305" font-size="25" font-weight="700" fill="#17323f" text-anchor="start">你提出新需求</text>
<text x="77" y="330" font-size="17" font-weight="400" fill="#3f5b69" text-anchor="start">可同时提交多件事</text>
</g>
<g class="node" data-box="386 276 325 76">
<rect x="386" y="276" width="325" height="76" rx="12" fill="#e7effb" stroke="#789ccc" stroke-width="1.5"/>
<text x="401" y="305" font-size="25" font-weight="700" fill="#275b96" text-anchor="start">Router 接单、分派</text>
<text x="401" y="330" font-size="17" font-weight="400" fill="#3f5b69" text-anchor="start">登记工单，分给各自小队</text>
</g>
<g class="node" data-box="925 222 290 76">
<rect x="925" y="222" width="290" height="76" rx="12" fill="#e8f3ee" stroke="#80b19f" stroke-width="1.5"/>
<text x="940" y="251" font-size="25" font-weight="700" fill="#0f6a58" text-anchor="start">工单 A · 活动简报</text>
<text x="940" y="276" font-size="17" font-weight="400" fill="#3f5b69" text-anchor="start">A 单的小队</text>
</g>
<g class="node" data-box="925 318 290 76">
<rect x="925" y="318" width="290" height="76" rx="12" fill="#e8f3ee" stroke="#80b19f" stroke-width="1.5"/>
<text x="940" y="347" font-size="25" font-weight="700" fill="#0f6a58" text-anchor="start">工单 B · 修改报名表</text>
<text x="940" y="372" font-size="17" font-weight="400" fill="#3f5b69" text-anchor="start">B 单的小队</text>
</g>
<g class="node" data-box="62 389 254 76">
<rect x="62" y="389" width="254" height="76" rx="12" fill="#f2f6f8" stroke="#abc0cd" stroke-width="1.5"/>
<text x="77" y="418" font-size="25" font-weight="700" fill="#17323f" text-anchor="start">B 单的后续消息</text>
<text x="77" y="443" font-size="17" font-weight="400" fill="#3f5b69" text-anchor="start">你补充的资料和决定</text>
</g>
<g class="node" data-box="386 389 325 76">
<rect x="386" y="389" width="325" height="76" rx="12" fill="#e8f3ee" stroke="#80b19f" stroke-width="1.5"/>
<text x="401" y="418" font-size="25" font-weight="700" fill="#0f6a58" text-anchor="start">按工单订阅直达</text>
<text x="401" y="443" font-size="17" font-weight="400" fill="#3f5b69" text-anchor="start">送回 B 单的小队，接着原进度做</text>
</g>
<text x="62" y="505" font-size="19" font-weight="400" fill="#3f5b69" text-anchor="start">制作前，你在原单批准本轮范围。</text>
<text x="62" y="532" font-size="19" font-weight="400" fill="#3f5b69" text-anchor="start">A 单等你决定时，会让出执行名额。已获批的 B 单有空位就能继续。</text>
</g>
</svg>
